plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.ultrapc.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.ultrapc.launcher'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de depuración para poder instalarlo directo
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
